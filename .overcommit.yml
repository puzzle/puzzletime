---
CommitMsg:
  CapitalizedSubject:
    # Conventional Commits subjects start lowercase (e.g. "feat: ..."), so this is off.
    enabled: false
  EmptyMessage:
    enabled: true
  HardTabs:
    enabled: true
  MessageFormat:
    enabled: true
    pattern: '\A(Merge |Revert |fixup! |squash! |(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._\-]+\))?!?: )'
    expected_pattern_message: 'Subject must follow Conventional Commits, e.g. "feat(scope): summary". See CONTRIBUTING.md.'
    sample_message: 'refactor(assets): shim forms, drop from bootstrap-frozen.css'
  RussianNovel:
    enabled: true
  SingleLineSubject:
    enabled: true
  SpellCheck:
    enabled: true
  TextWidth:
    enabled: true
    max_subject_width: 72
  TrailingPeriod:
    enabled: true

PostCheckout:
  BundleInstall:
    enabled: true
  IndexTags:
    enabled: true
  NpmInstall:
    enabled: true
  SubmoduleStatus:
    enabled: true
  YarnInstall:
    enabled: true

PostCommit:
  BundleInstall:
    enabled: true
  Commitplease:
    enabled: false
  GitGuilt:
    enabled: true
  IndexTags:
    enabled: true
  NpmInstall:
    enabled: true
  SubmoduleStatus:
    enabled: true
  YarnInstall:
    enabled: true

PostMerge:
  BundleInstall:
    enabled: true
  IndexTags:
    enabled: true
  NpmInstall:
    enabled: true
  SubmoduleStatus:
    enabled: true
  YarnInstall:
    enabled: true

PostRewrite:
  BundleInstall:
    enabled: true
  IndexTags:
    enabled: true
  NpmInstall:
    enabled: true
  SubmoduleStatus:
    enabled: true
  YarnInstall:
    enabled: true

PreCommit:
  AuthorEmail:
    enabled: true
  AuthorName:
    enabled: true
  BrokenSymlinks:
    enabled: true
  BundleAudit:
    enabled: true
  BundleCheck:
    enabled: true
  BundleOutdated:
    enabled: true
  CaseConflicts:
    enabled: true
  ChamberSecurity:
    enabled: true
  CssLint:  # abandoned (2018), cannot parse @layer/custom properties; Stylelint covers CSS
    enabled: false
  ErbLint:
    enabled: true
  ExecutePermissions:
    enabled: true
    exclude:
      - bin/**/*
      - script/**/*
      - git-hooks/**/*
  Fasterer:
    enabled: true
  FileSize:
    enabled: true
  FixMe:
    enabled: true
  ForbiddenBranches:
    enabled: true
  LicenseFinder:
    # FIXME: Enable in the end
    enabled: false
  HamlLint:
    enabled: true
  HardTabs:
    enabled: true
    exclude:
      - app/assets/stylesheets/vendor/**/*
      - app/javascript/vendor/**/*
  HtmlHint:
    enabled: true
  HtmlTidy:
    enabled: true
  ImageOptim:  # binaries come from image_optim_pack, svgo from bin/setup_overcommit
    enabled: true
  JsHint:  # ES5-only, cannot parse the ES6 sources; Standard covers JS
    enabled: false
  JsLint:  # ES5-only, stops at the first `const`; Standard covers JS
    enabled: false
  JsonSyntax:
    enabled: true
  LineEndings:
    enabled: true
    exclude:
      - "**/*.ttf"
      - "**/*.eot"
      - "**/*.woff"
      - "**/*.gif"
      - "**/*.png"
      - "**/*.ico"
  LocalPathsInGemfile:
    enabled: true
  MergeConflicts:
    enabled: true
  RailsBestPractices:
    enabled: true
  RailsSchemaUpToDate:
    enabled: true
  Reek:
    enabled: true
  RuboCop:
    enabled: true
  RubyLint:  # Does not play well with Rails
    enabled: false
  RubySyntax:
    enabled: true
  ScssLint:  # unmaintained, cannot parse dart-sass `math.div`; Stylelint covers SCSS
    enabled: false
  ShellCheck:
    enabled: true
  Sqlint:
    enabled: true
  Standard:
    enabled: true
    exclude:
      - app/javascript/vendor/**/*
      - app/javascript/modernizr.js
  Stylelint:
    enabled: true
    # Owns plain CSS (incl. the Tailwind v4 source) and SCSS; vendored files are in .stylelintrc.json ignoreFiles.
    include:
      - '**/*.css'
      - '**/*.scss'
  TrailingWhitespace:
    enabled: true
  YamlLint:
    enabled: true
  YamlSyntax:  # Problems with newer psych
    enabled: false
  YarnCheck:
    enabled: true

PrePush:
  Brakeman:
    enabled: true
  # Not the Minitest hook: it runs `ruby -r<each test file>`, which skips
  # test:prepare and so tests whatever bundle sits in app/assets/builds.
  # `bin/rails test` without paths rebuilds JS, Sass and Tailwind first.
  RakeTarget:
    enabled: true
    description: 'Build assets and run the test suite'
    required_executable: 'bin/rails'
    targets: ['test']
  ProtectedBranches:
    enabled: true

PreRebase:
  MergedCommits:
    enabled: true
...
