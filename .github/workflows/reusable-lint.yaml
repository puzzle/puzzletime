---
name: 'Code Style Review'

"on":
  workflow_call:
    inputs:
      ref:
        description: "Ref to checkout"
        type: string

permissions:
  contents: read
  checks: write
  pull-requests: write

# The linters live in the optional :overcommit group (see .overcommit.yml). Set
# here so every job shares one setup-ruby bundler cache (BUNDLE_WITH is part of
# its cache key).
env:
  BUNDLE_WITH: 'overcommit'

jobs:
  # Warms the bundler cache once; the linter jobs below only restore it.
  prepare:
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

  rubocop:
    runs-on: 'ubuntu-latest'
    needs: prepare

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: reviewdog/action-rubocop@v2
        with:
          rubocop_version: gemfile
          rubocop_extensions: rubocop-minitest:gemfile rubocop-performance:gemfile rubocop-rails:gemfile
          # reporter: github-pr-review
          level: error

  brakeman:
    runs-on: 'ubuntu-latest'
    needs: prepare

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: reviewdog/action-brakeman@v2
        with:
          brakeman_version: gemfile
          level: error

  actionlint:
    runs-on: 'ubuntu-latest'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: reviewdog/action-actionlint@v1
        with:
          level: error

  ruby-lint:
    runs-on: 'ubuntu-latest'
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'HAML-Lint'
            command: 'bundle exec haml-lint --reporter checkstyle'
            format: '-f=checkstyle'
          - name: 'Reek'
            command: 'bundle exec reek --single-line --no-progress app lib'
            # reek indents every smell by two spaces under its file heading
            format: '-efm=  %f:%l: %m'
          - name: 'Rails-Best-Practices'
            command: 'bundle exec rails_best_practices --without-color'
            format: '-efm=%f:%l - %m'
          - name: 'ERB-Lint'
            command: 'bundle exec erb_lint --lint-all --format compact'
            format: '-efm=%f:%l:%c: %m'
          - name: 'Fasterer'
            command: 'bundle exec fasterer'
            format: '-efm=%f:%l %m'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: reviewdog/action-setup@v1

      - name: ${{ matrix.name }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          ${{ matrix.command }} |
          sed -E 's/\x1B\[[0-9;]*m//g' |
          reviewdog \
          "${{ matrix.format }}" \
          -name="${{ matrix.name }}" \
          -reporter=github-pr-review
...
