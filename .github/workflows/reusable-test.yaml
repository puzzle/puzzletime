---
name: "Rails Unit Tests"

"on":
  workflow_call:
    inputs:
      ref:
        description: "Ref to checkout"
        type: string

jobs:
  minitest:
    runs-on: 'ubuntu-latest'

    timeout-minutes: 15

    services:
      postgres:
        image: "postgres:11"
        env:
          POSTGRES_PASSWORD: "postgres"
        # Host ports off the defaults so a local postgres/memcached does not
        # collide when running this workflow with act
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      memcached:
        image: "memcached"
        ports: ["51121:11211"]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # assets:precompile below runs esbuild via jsbundling-rails
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Ferrum/cuprite needs a Chrome binary: hosted runners ship one, act images do not
      - uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: 'Build and test with Rake'
        env:
          RAILS_TEST_DB_NAME: 'postgres'
          RAILS_TEST_DB_PORT: '55432'
          RAILS_MEMCACHED_PORT: '51121'
          RAILS_TEST_DB_USERNAME: 'postgres'
          RAILS_TEST_DB_PASSWORD: 'postgres'
          RAILS_ENV: 'test'
          CI: 'true'
          PGDATESTYLE: German
        run: |
          sudo apt-get -yqq update
          sudo apt-get -yqq install libpq-dev libvips-dev
          bundle exec rails db:create
          bundle exec rails db:migrate
          SKIP_YARN_INSTALL=1 bundle exec rails assets:precompile
          bundle exec rails test
...
