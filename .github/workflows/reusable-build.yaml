---
name: "Reusable: Build and push image"

"on":
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag or SHA to build; empty = the triggering commit"
        type: string
        default: ""
      environment:
        description: "Environment to run in"
        type: string
        required: true
      project_name:
        description: "Project name, e.g. pitc-ptime-int"
        type: string
        required: true
      push:
        description: "Build and debug things without pushing to the registry"
        type: boolean
        default: false
      no_cache:
        description: "Ignore the registry build cache; cache-to still rewrites it"
        type: boolean
        default: false
      registry:
        description: "FQDN of the registry"
        type: string
        required: false
        default: ""
      registry_url:
        description: "URL to push image to"
        type: string
        required: false
        default: ""

    secrets:
      PUZZLE_REGISTRY_USERNAME:
        description: "Needed for the registry login"
        required: true
      PUZZLE_REGISTRY_TOKEN:
        description: "Needed for the registry login"
        required: true

jobs:
  build:
    environment: ${{ inputs.environment }}
    runs-on: "ubuntu-latest"

    env:
      BUILD_REGISTRY: ${{ inputs.registry || vars.REGISTRY }}
      BUILD_REGISTRY_URL: ${{ inputs.registry_url || vars.REGISTRY_URL }}

    steps:
      - name: Input Validation
        run: |
          exit_code=0

          if [ -z "${BUILD_REGISTRY}" ]; then
            echo "::error title=Configuration Error::BUILD_REGISTRY is empty."
            echo "Please ensure 'registry' input is set or 'REGISTRY' variable is configured in the ${{ inputs.environment }} environment."
            exit_code=1
          fi

          if [ -z "${BUILD_REGISTRY_URL}" ]; then
            echo "::error title=Configuration Error::BUILD_REGISTRY_URL is empty."
            echo "Please ensure 'registry_url' input is set or 'REGISTRY_URL' variable is configured in the ${{ inputs.environment }} environment."
            exit_code=1
          fi

          exit "${exit_code}"

      # Resolve to a full SHA so the image tag, BUILD_COMMIT and the git build
      # context all point at the same commit.
      - name: Resolve source ref
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "${REF}" ]; then
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "ref_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)"
            echo "sha=${sha}" >> "$GITHUB_OUTPUT"
            echo "ref_name=${REF}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.BUILD_REGISTRY }}
          username: ${{ secrets.PUZZLE_REGISTRY_USERNAME }}
          password: ${{ secrets.PUZZLE_REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ steps.src.outputs.sha }}
          file: Dockerfile
          build-args: |
            GITHUB_REF_NAME=${{ steps.src.outputs.ref_name }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REPOSITORY_URL=${{ github.repositoryUrl }}
            GITHUB_SHA=${{ steps.src.outputs.sha }}
          target: app
          tags: |
            ${{ env.BUILD_REGISTRY_URL }}:latest
            ${{ env.BUILD_REGISTRY_URL }}:git-${{ steps.src.outputs.sha }}
          push: ${{ inputs.push }}
          no-cache: ${{ inputs.no_cache }}
          cache-from: type=registry,ref=${{ env.BUILD_REGISTRY_URL }}:buildcache
          cache-to: type=registry,ref=${{ env.BUILD_REGISTRY_URL }}:buildcache,mode=max

      - name: 'Report image tags'
        if: inputs.push
        env:
          SHA: ${{ steps.src.outputs.sha }}
        run: |
          echo "::notice title=Image pushed::${BUILD_REGISTRY_URL}:latest, ${BUILD_REGISTRY_URL}:git-${SHA} (digest ${{ steps.build.outputs.digest }})"
          {
            echo '### Image pushed'
            echo
            echo '| Tag | Digest |'
            echo '| --- | --- |'
            echo "| \`${BUILD_REGISTRY_URL}:latest\` | \`${{ steps.build.outputs.digest }}\` |"
            echo "| \`${BUILD_REGISTRY_URL}:git-${SHA}\` | \`${{ steps.build.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
